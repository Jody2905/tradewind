{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Create an account</h1>
  <form method="post" class="card stack" novalidate>{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    {% for field in form %}
      <label>{{ field.label }} {{ field }}
        {% if field.name == 'password1' %}<span class="hint">At least 10 characters, not a common password.</span>{% endif %}
        {% for e in field.errors %}<span class="err">{{ e }}</span>{% endfor %}</label>
    {% endfor %}
    <button class="btn btn-primary">Create account</button>
  </form>
  <p class="center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
