{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Log in</h1>
  <form method="post" class="card stack">{% csrf_token %}
    {% if form.errors %}<div class="msg msg-error">Wrong email or password.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button class="btn btn-primary">Log in</button>
  </form>
  <p class="center">New here? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
</div>
{% endblock %}
