name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite · Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - name: Demo commands work on a fresh database
        run: |
          python manage.py migrate
          python manage.py seed_demo
          python manage.py shop_demo
          python manage.py expire_unpaid_orders

  postgres:
    name: PostgreSQL 16 · Python 3.13
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradewind
          POSTGRES_PASSWORD: tradewind
          POSTGRES_DB: tradewind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradewind" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRADEWIND_DATABASE_URL: postgresql://tradewind:tradewind@localhost:5432/tradewind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt
      - run: python -m pytest
      - run: |
          python manage.py migrate
          python manage.py seed_demo

  deploy-check:
    name: Production security settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Django's deployment checklist passes with DEBUG off
        env:
          TRADEWIND_DEBUG: "0"
          TRADEWIND_ALLOWED_HOSTS: shop.example.com
        run: |
          export TRADEWIND_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(50))")
          python manage.py check --deploy --fail-level WARNING
